# Scenario Name 
scenario: "FULLSSP2DEFAULTEL"

# Temporal Parameters 
startYear: 2021
endYear: 2050
daytype: False
dayparts:
# daypart : [start_hour (inclusive), end_hour (exclusive)]
  D1: [1, 13]
  D2: [13, 25]
seasons:
# season : [month 1, month 2, ...] (all inclusive)
  S1: [1, 2, 3, 4, 5, 6]
  S2: [7, 8, 9, 10, 11, 12]

timeshift: 0 # value between -11 and 12

